name: amlake_flow_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.2
  get: ^4.6.6
  connectivity_plus: ^6.1.0
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.0.18
  local_auth: ^2.2.0
  syncfusion_flutter_pdfviewer: ^34.2.9

  webview_flutter: ^4.2.2
  shimmer_animation: ^2.2.2
  smooth_page_indicator: ^1.2.0
  country_icons: ^2.0.1
  flutter_svg: ^2.1.1
  image_picker: ^0.8.7+5
  pinput: ^5.0.0
  google_fonts: ^6.3.1
  flutter_staggered_grid_view: ^0.7.0
  dropdown_search: ^6.0.1
  country_picker: ^2.0.25
  change_app_package_name: ^1.5.0
  record: ^6.1.1
  audioplayers: ^6.5.0
  video_player: ^2.10.0
  in_app_purchase: ^3.2.3

  # Localization
  intl_utils: ^2.8.7

  # Toast
  fluttertoast: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  radio_group_v2: ^3.3.1

flutter_icons:
  android: true
  ios: true
  image_path: "images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - images/

flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  output_dir: lib/generated